<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic To-Do Web App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #020617;
            width: 380px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
            color: #facc15;
        }

        .input-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            outline: none;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #22c55e;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        h2 {
            margin-top: 20px;
            font-size: 16px;
            color: #38bdf8;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #020617;
            margin-top: 8px;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .time {
            font-size: 11px;
            color: #94a3b8;
        }

        .actions button {
            margin-left: 5px;
            padding: 5px 8px;
            font-size: 12px;
        }

        .complete {
            text-decoration: line-through;
            color: #22c55e;
        }

        .delete {
            background: #ef4444;
        }

        .edit {
            background: #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>To-Do Web App</h1>

    <div class="input-box">
        <input type="text" id="taskInput" placeholder="Enter your task">
        <button onclick="addTask()">Add</button>
    </div>

    <h2>Pending Tasks</h2>
    <ul id="pendingList"></ul>

    <h2>Completed Tasks</h2>
    <ul id="completedList"></ul>
</div>

<script>
    function addTask() {
        const input = document.getElementById("taskInput");
        const taskText = input.value.trim();

        if (taskText === "") return;

        const li = document.createElement("li");

        const taskInfo = document.createElement("div");
        taskInfo.innerHTML = `
            <span>${taskText}</span>
            <div class="time">Added: ${new Date().toLocaleString()}</div>
        `;

        const actions = document.createElement("div");
        actions.className = "actions";

        const completeBtn = document.createElement("button");
        completeBtn.textContent = "✔";
        completeBtn.onclick = () => completeTask(li);

        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.className = "edit";
        editBtn.onclick = () => editTask(taskInfo);

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "✖";
        deleteBtn.className = "delete";
        deleteBtn.onclick = () => li.remove();

        actions.append(completeBtn, editBtn, deleteBtn);
        li.append(taskInfo, actions);

        document.getElementById("pendingList").appendChild(li);
        input.value = "";
    }

    function completeTask(task) {
        task.querySelector("span").classList.add("complete");
        document.getElementById("completedList").appendChild(task);
    }

    function editTask(taskInfo) {
        const currentText = taskInfo.querySelector("span").textContent;
        const newText = prompt("Edit task:", currentText);
        if (newText !== null && newText.trim() !== "") {
            taskInfo.querySelector("span").textContent = newText;
        }
    }
</script>

</body>
</html>
